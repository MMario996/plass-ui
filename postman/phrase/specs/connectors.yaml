{
  "openapi": "3.1.0",
  "info": {
    "title": "Connectors API",
    "description": "The Connectors API (Bifrost) is the public gateway between Phrase clients and the\nindividual content connectors (Google Drive, Contentful, Tridion, Optimizely, ...).\nEvery endpoint follows the same request/response contract — this page documents the\nshared pieces. Per-connector pages below show the connector-specific request bodies.\n\n---\n\n## Gateway prefix\n\nWhen calling Bifrost through the public Phrase gateway, **prefix every path with `/connectors`**:\n\n```\nhttps://\u003cphrase-host\u003e/connectors/\u003cconnector\u003e/v1/\u003coperation\u003e\n```\n\nInternal callers (service-to-service inside the Phrase cluster) call Bifrost directly\nand omit the `/connectors` prefix. The OpenAPI paths below show the *internal* form.\n\n---\n\n## Authentication\n\nAll endpoints require an IDM-issued JWT in the `Authorization` header:\n\n```\nAuthorization: Bearer \u003cJWT\u003e\n```\n\nBifrost decodes the token, resolves the caller\u0027s TMS account via IDM Discovery, and\nexchanges the JWT for a short-lived TMS access token transparently. Callers do not\nhandle TMS tokens directly.\n\n---\n\n## Connector identity \u0026 credentials\n\nEvery request body carries a **`connectorUuid`** that references a connector instance\nconfigured in TMS. Bifrost loads the connector\u0027s stored credentials and uses them to\ntalk to the underlying system — callers never handle connector credentials directly.\n\nNew connectors are created in TMS — e.g. for Google Drive:\n`https://\u003ctms-host\u003e/tms/connectors/create?connectorType\u003dGOOGLE_DRIVE2`.\n\n---\n\n## Synchronous vs asynchronous variants\n\nMost operations expose two variants:\n\n| Path prefix | Behavior |\n|---|---|\n| `/sync/...`  | Blocks until the operation completes. Best for small payloads / interactive flows. |\n| `/async/...` | Returns immediately with `{ requestId, webHookUrl }`. Bifrost POSTs the result to `X-Webhook` when ready, or you can poll. Use for large payloads and long-running work. |\n\nFor async endpoints, the `X-Webhook` header is **required** — Bifrost will POST the\nresult there once the connector finishes processing.\n\n---\n\n## Common headers\n\n| Header | Direction | Purpose |\n|---|---|---|\n| `Authorization` | request | `Bearer \u003cJWT\u003e` — required on every endpoint. |\n| `X-ActionId` | request + response | Correlation id propagated through Phrase logs. Generated by Bifrost when omitted; always returned on the response. |\n| `X-Webhook` | request | Required on `/async/...` endpoints. URL that receives the result. |\n| `X-ResponseType` | request | `ID` (default) — JSON with `storageId`. `OBJECT` — raw binary stream (`application/octet-stream`). Use `ID` for files \u003e 1 MB. |\n| `X-Upload-Mode` | request | `STORAGE` (default) — upload bytes already in file storage. `STREAM` — initialize a streaming upload session; the response carries `uploadUrl` + `X-Stream-Token` for the phase-2 PUT. Currently supported by Google Drive only. |\n| `X-Stream-Token` | request | Required on phase-2 streaming upload PUTs. Value returned by phase-1. |\n\n---\n\n## Raw vs XLIFF operations\n\nMost connectors expose two content shapes:\n\n- **Raw** (`download-raw-file`, `upload-raw-file`) — the connector\u0027s native content,\n  unmodified. Use when you want the original asset.\n- **XLIFF** (`download-xliff-file`, `upload-xliff-file`) — the same content converted\n  to/from XLIFF 2.0 ready for translation. The connector applies its segmentation\n  and serialization rules.\n\n`convert-to-xliff` / `convert-to-raw` are the standalone conversion variants that\noperate on already-stored files referenced by `storageId`.\n\n---\n\n## Error model\n\nErrors come back in two envelopes depending on the endpoint:\n\n- **Operations that report partial success** (upload, convert) return `200 OK` with:\n  ```json\n  { \"success\": false, \"errors\": [{ \"code\": \"404\", \"message\": \"Content was not found.\" }] }\n  ```\n- **Hard failures** return a 4xx/5xx with an `ErrorResponse` body. HTTP status maps\n  to the Bifrost error taxonomy:\n\n  | Status | Error type | Typical cause |\n  |---|---|---|\n  | 401, 403 | `auth_error` | Missing/invalid JWT, IDM identity unresolved, connector credential rejected upstream. |\n  | 429 | `rate_limited` | Caller or upstream rate limit hit. |\n  | 400 | `processing_error` | Bad request body, validation failure, unsupported configuration. |\n  | 4xx (other) | `processing_error` | Connector returned a client error. |\n  | 5xx | `upstream_error` | Connector or downstream Phrase service failed. |\n  | timeout | `timeout` | Upstream did not respond in time. |\n  | deserialization | `deserialization` | Connector returned a malformed response. |\n  | other | `unknown` | Unclassified. |\n\n  `X-ActionId` is returned on every error response — quote it when reporting issues.\n\n---\n\n## Streaming uploads (two-phase)\n\nFor connectors that support `X-Upload-Mode: STREAM` (currently Google Drive):\n\n1. **Phase 1** — `POST /\u003cconnector\u003e/v1/sync/upload-raw-file` with\n   `X-Upload-Mode: STREAM` and a body that includes `name`, `size`, and a `FOLDER`\n   path. The response is:\n   ```json\n   {\n     \"uploadUrl\": \"/\u003cconnector\u003e/v1/sync/upload-raw-file/stream/\u003cstreamId\u003e\",\n     \"streamToken\": \"\u003ctoken\u003e\",\n     \"expiresAt\": \"2026-01-29T13:48:01Z\",\n     \"maxBytes\": 240113628\n   }\n   ```\n   `uploadUrl` is relative — prepend the gateway host (and `/connectors` prefix when\n   calling through the public gateway).\n2. **Phase 2** — `PUT \u003chost\u003e\u003cuploadUrl\u003e` with the raw bytes,\n   `X-Stream-Token: \u003ctoken\u003e`, and a `Content-Type` matching the file. `Content-Length`\n   must equal the declared `size`.\n\nStreams expire at `expiresAt`. Large transfers may need increased client-side timeouts.\n",
    "version": "1.0"
  },
