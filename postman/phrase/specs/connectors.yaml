        "required": [
          "connectorUuid"
        ]
      },
      "GoogleDrive2DownloadRawFileApiBody": {
        "type": "object",
        "description": "Request payload for downloading a raw file from Google Drive through the connector.\n\nClients authenticate by referencing a stored connector via connectorUuid. The path\ndescribes which file or location to download from.\n",
        "properties": {
          "connectorUuid": {
            "type": "string",
            "default": "",
            "description": "UUID of a configured connector that holds stored Google Drive credentials.\n",
            "example": "b9c06f76-4a44-4d2e-8a26-3d1e4b47e123"
          },
          "configuration": {
            "$ref": "#/components/schemas/GoogleDrive2ConfigurationDto",
            "default": "",
            "description": "Connector configuration for this request.\nCurrently unused, but reserved for future configuration flags.\n"
          },
          "path": {
            "type": "null",
            "$ref": "#/components/schemas/WebApiGoogleDrive2PathDto",
            "default": "",
            "description": "Google Drive path to the file or location to download.\n\nThe pathType field determines the shape:\n- ROOT - list available spaces (\"My Drive\", \"Shared drives\")\n- SHARED_DRIVES_ROOT - list shared drives\n- FOLDER - represent a folder\n- FILE - represent a specific file\n\nFor downloading a raw file, use a FILE path with a resolved fileId and parentChain.\n"
          },
          "locale": {
