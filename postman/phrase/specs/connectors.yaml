      "GoogleDrive2ListFilesApiBody": {
        "type": "object",
        "description": "Request payload for listing folders and files in Google Drive.\n\nThe path determines where the listing starts (for example, connector root, a shared drive,\nor a specific folder). Authentication is provided via connectorUuid.\n",
        "properties": {
          "connectorUuid": {
            "type": "string",
