          },
          "default": {
            "description": "Bad request or upstream failure. Returns an `ErrorResponse` body. See the API\noverview\u0027s \"Error model\" section for the HTTP status → error-type mapping. The\n`X-ActionId` header is set on every error response — quote it when reporting issues.\n",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse",
                  "additionalProperties": {
                    "default": ""
                  },
                  "default": ""
                }
              }
            }
          }
        }
      }
    },
    "/tridion/v1/sync/download-raw-file": {
      "post": {
        "tags": [
          "Tridion Docs"
        ],
        "summary": "Download raw Tridion content synchronously",
        "description": "Download raw content from SDL Tridion without any connector-side conversion. The\nreturned payload is the native item content (typically XML) for the items selected\nby `path` and `configuration`.\n\nUse this when you want the original, untranslated content (e.g. to build a custom\npreview, snapshot a folder, or feed an analytics pipeline).\n\n**Choosing sync vs async**\n\n- `/sync/download-raw-file` blocks until the connector finishes. Use for small\n  selections and interactive callers. Subject to gateway timeouts (~60 s).\n- `/async/download-raw-file` returns immediately with a `requestId` and posts the\n  result to the URL in `X-Webhook` when ready. Required for large selections.\n\n**Response shape (sync only)** is controlled by `X-ResponseType`:\n\n- `ID` (default) — JSON `{ \"storageId\": \"...\" }`. The caller fetches the content from\n  Phrase file storage later. Recommended for any non-trivial payload.\n- `OBJECT` — raw `application/octet-stream`. Faster for tiny payloads, but holds the\n  file in memory.\n",
        "operationId": "tridionDownloadRawContentSync",
        "parameters": [
          {
            "name": "X-ActionId",
            "in": "header",
            "description": "A logging ID of the request. It is propagated through Phrase systems, making it easier to connect logs from various services.\nIf no ActionId is sent with a request, one will be generated by Bifrost and returned with the response.\n",
            "required": false,
            "schema": {
              "type": "string",
              "default": ""
            },
            "example": "e48eda63928c4155bez9fdbsaadc15f3"
          },
          {
            "name": "X-ResponseType",
            "in": "header",
            "description": "Specify if the response should contain the processed object itself in an application/octet-stream body,\nor a application/json body with an ID that can be then used to retrieve the object using a /load-content endpoint.\nNote that for larger files (\u003e 1 MB), it is advised to use the ID option which is also default.\n (ID \u003d\u003e JSON with storageId, OBJECT \u003d\u003e binary stream).",
            "required": false,
            "schema": {
              "type": "string",
              "default": "ID",
              "enum": [
                "ID",
                "OBJECT"
              ]
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/TridionDownloadRawFileApiBody",
                "additionalProperties": {
                  "default": ""
                },
                "default": ""
              },
              "examples": {
                "Stored credentials": {
                  "description": "Stored credentials",
                  "value": {
                    "connectorUuid": "4282fec0-d2e9-4266-8733-3e634feb7b59",
                    "configuration": {},
                    "path": {
                      "pathType": "ITEM",
                      "itemId": "tcm:1-2345"
                    },
                    "sourceLocale": "en"
                  }
                }
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "OK — raw binary stream (returned when `X-ResponseType\u003dOBJECT`).",
            "headers": {
              "Content-Disposition": {
                "description": "`attachment; filename\u003d\"\u003cactionId\u003e\"` when served from file storage.",
                "style": "simple",
                "schema": {
                  "type": "array",
                  "contains": {
                    "default": ""
                  },
                  "items": {
                    "default": ""
                  },
                  "unevaluatedItems": {
                    "default": ""
                  }
                }
              },
              "X-ActionId": {
                "description": "A logging ID of the request. It is propagated through Phrase systems, making it easier to connect logs from various services.\nIf no ActionId is sent with a request, one will be generated by Bifrost and returned with the response.\n",
                "style": "simple",
                "schema": {
                  "type": "array",
                  "contains": {
                    "default": ""
                  },
                  "items": {
                    "default": ""
                  },
                  "unevaluatedItems": {
                    "default": ""
                  }
                }
              },
              "Content-Type": {
                "description": "`application/octet-stream` (or the upstream content type when streamed).",
                "style": "simple",
                "schema": {
                  "type": "array",
                  "contains": {
                    "default": ""
                  },
                  "items": {
                    "default": ""
                  },
                  "unevaluatedItems": {
                    "default": ""
                  }
                }
              }
            },
            "content": {
              "application/octet-stream": {
                "schema": {
                  "type": "string",
                  "format": "binary",
                  "additionalProperties": {
                    "default": ""
                  },
                  "default": ""
                }
              }
            }
