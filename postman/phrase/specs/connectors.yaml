      "DriveRefDto": {
        "description": "Drive scope that Google Drive operations should target.\n\nThe driveType discriminator determines whether the path refers to the authenticated\nuser\u0027s \"My Drive\" space or to a specific shared drive.\n",
        "discriminator": {
          "propertyName": "driveType",
          "mapping": {
            "MY_DRIVE": "#/components/schemas/MyDriveRefDto",
            "SHARED_DRIVE": "#/components/schemas/SharedDriveRefDto"
          }
        },
        "oneOf": [
          {
            "$ref": "#/components/schemas/MyDriveRefDto"
          },
          {
            "$ref": "#/components/schemas/SharedDriveRefDto"
          }
        ],
        "properties": {
          "driveType": {
            "type": "string"
          }
        },
        "required": [
          "driveType"
        ]
      },
      "FilePathDto": {
        "description": "Resolved file location inside a specific Google Drive space.\n\nCaptures drive scope, the ordered chain of parent folders, and the file identifier.\nFor read-only workflows, fileId and all parent ids should be resolved. For export\nworkflows, fileId may be null when creating a new file.\n",
        "properties": {
          "pathType": {
            "type": "string",
            "default": "",
            "description": "Shape discriminator for this path.\nMust be FILE for this DTO.\n",
            "enum": [
              "FILE"
            ],
            "example": "FILE"
          },
          "fileId": {
            "type": [
              "string",
              "null"
            ],
            "default": "",
            "description": "Google Drive file identifier, when known.\n\nRequired for listing or downloading existing files. May be null when the\nconnector is expected to create a new file in the target folder.\n",
            "example": "1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms"
          },
          "name": {
            "type": [
              "string",
              "null"
            ],
            "default": "",
            "description": "Human-readable display name of the file.\nOptional and not guaranteed to be unique within a folder.\n",
            "example": "welcome-email.docx"
          },
          "drive": {
            "$ref": "#/components/schemas/DriveRefDto",
            "default": "",
            "description": "Drive scope for this path.\n\n- MY_DRIVE - the authenticated user\u0027s \"My Drive\"\n- SHARED_DRIVE - a specific shared drive identified by driveId\n"
          },
          "parentChain": {
            "type": "array",
            "default": "",
            "description": "Ordered chain of parent folders from the drive root down to the direct parent\nof the file. The file itself is not included.\n\nFor read-only workflows, each parent should have a non-empty id so that the\nconnector can reconstruct the full location without additional discovery.\n",
            "items": {
              "$ref": "#/components/schemas/ParentRefDto"
            }
          }
        },
        "required": [
          "drive",
          "parentChain",
          "pathType"
        ]
      },
      "FolderPathDto": {
        "description": "Resolved folder location within a Google Drive space.\n\nRepresents both \"My Drive\" folders and shared drive folders. The folderId identifies\nthe folder in its drive. The parentChain lists real ancestors from the drive root\nto the folder\u0027s direct parent.\n",
        "properties": {
          "pathType": {
            "type": "string",
            "default": "",
            "enum": [
              "FOLDER"
            ],
            "example": "FOLDER"
          },
          "folderId": {
            "type": [
              "string",
              "null"
            ],
            "default": "",
            "description": "Google Drive folder identifier.\n\nFor \"My Drive\", the root folder uses id \"root\".\nFor shared drives, the root folder typically uses the shared drive id.\n\nRequired for listing or downloading existing folders. May be null when\nthe connector is expected to create the folder during an export workflow.\n",
            "example": "root"
          },
          "name": {
            "type": [
              "string",
              "null"
            ],
            "default": "",
            "description": "Human-readable display name of the folder.\nOptional and not guaranteed to be unique under a given parent.\n",
            "example": "Marketing"
          },
          "drive": {
            "$ref": "#/components/schemas/DriveRefDto",
            "default": "",
            "description": "Drive scope for this folder.\n\n- MY_DRIVE - the authenticated user\u0027s \"My Drive\"\n- SHARED_DRIVE - a specific shared drive identified by driveId\n"
          },
          "parentChain": {
            "type": "array",
            "default": "",
            "description": "Ordered chain of parent folders from the drive root down to the direct parent\nof this folder. The folder itself is not included.\n\nFor read-only workflows, each parent should have a non-empty id so that the\nconnector can reconstruct the full location without additional discovery.\n",
            "items": {
              "$ref": "#/components/schemas/ParentRefDto"
            }
          },
          "owner": {
            "type": "string"
          },
          "repo": {
            "type": "string"
          },
          "branch": {
            "type": "string"
          },
          "location": {
            "type": "string"
          }
        },
        "required": [
          "drive",
          "parentChain",
          "pathType"
        ]
      },
      "GoogleDrive2ConfigurationDto": {
        "description": "Connector configuration for the Google Drive connector.\n\nCurrently no configuration options are exposed. The object is reserved for future\nconfiguration flags while keeping the API contract stable.\n",
        "example": {}
      },
      "GoogleDrive2UploadRawFileApiBody": {
        "type": "object",
        "description": "Request payload for uploading raw content to Google Drive.\n\nWhen X-Upload-Mode\u003dSTORAGE, storageId refers to content previously persisted in the connector\u0027s file storage.\nWhen X-Upload-Mode\u003dSTREAM, storageId must be omitted and the request registers a stream ticket.\nIf X-Upload-Mode is omitted, STORAGE is used.\nFor async uploads, storageId is required.\n\nThe path defines the Drive location where the file should be created or updated.\n",
        "properties": {
          "connectorUuid": {
            "type": "string",
            "default": "",
            "description": "UUID of a configured connector that holds stored Google Drive credentials.\n",
            "example": "b9c06f76-4a44-4d2e-8a26-3d1e4b47e123"
          },
          "configuration": {
            "$ref": "#/components/schemas/GoogleDrive2ConfigurationDto",
            "default": "",
            "description": "Connector configuration for this request.\nCurrently unused, but reserved for future configuration flags.\n"
          },
          "path": {
            "type": "null",
            "$ref": "#/components/schemas/WebApiGoogleDrive2PathDto",
            "default": "",
            "description": "Google Drive path describing where the raw file should be written.\n\n- For creating a new file, provide a FOLDER path that identifies the target folder.\n- For updating an existing file, provide a FILE path with a resolved fileId.\n"
          },
          "locale": {
            "type": "string",
            "default": "",
            "description": "Locale code associated with the raw content being uploaded, if applicable.\nOptional. Use a BCP 47 or Phrase locale code (for example, \"en\", \"de\", \"cs\").\n",
            "example": "en"
          },
          "storageId": {
            "type": "string",
            "default": "",
            "description": "Storage ID of the raw file to upload to Google Drive.\nMust reference content previously stored in the connector\u0027s file storage.\n\nRequired when X-Upload-Mode\u003dSTORAGE. Must be omitted when X-Upload-Mode\u003dSTREAM.\n",
            "example": "fs_5f1d2a4c-0e89-4af7-9e4b-3b4a2d1e9c01"
          },
          "name": {
            "type": "string",
            "default": "",
            "description": "Name of the file to be uploaded. Used in STREAM mode.",
            "example": "large_file.zip"
          },
          "size": {
            "type": "integer",
            "format": "int64",
            "default": "",
            "description": "Size of the file in bytes. Used in STREAM mode.",
            "example": 10857600
          }
        },
        "required": [
          "connectorUuid"
        ]
      },
      "MyDriveRefDto": {
        "description": "Drive reference that scopes operations to the authenticated user\u0027s \"My Drive\".\n\nThe actual Google account is derived from the OAuth credentials; no additional\nidentifiers are required.\n",
        "example": {
          "driveType": "MY_DRIVE"
        },
        "properties": {
          "driveType": {
            "type": "string"
          }
        },
        "required": [
          "driveType"
        ]
      },
      "ParentRefDto": {
        "type": "object",
        "description": "Descriptor for a parent folder in a Google Drive location hierarchy.\n\nEntries are ordered from the drive root to the direct parent of the leaf resource.\nThis allows clients to reconstruct human-readable paths and understand where\na file or folder lives.\n",
        "properties": {
          "id": {
            "type": [
              "string",
              "null"
            ],
            "default": "",
            "description": "Google Drive identifier of the parent folder, when known.\n\nRequired for read-only workflows that must address existing folders without\nadditional discovery. May be null when folders are created or resolved by name.\n",
            "example": "0AOpExampleParentIdUk9PVA"
          },
          "name": {
            "type": "string",
            "default": "",
            "description": "Human-readable display name of the parent folder.\nRequired and never blank.\n",
            "example": "Projects"
          }
        },
        "required": [
          "name"
        ]
      },
      "SharedDriveRefDto": {
        "description": "Drive reference that scopes operations to a specific shared drive.\n\nThe driveId is the immutable identifier returned by the Google Drive API and\nremains stable even if the shared drive is renamed.\n",
        "properties": {
          "driveType": {
            "type": "string"
          },
          "driveId": {
            "type": "string",
            "default": "",
            "description": "Google Drive shared drive identifier.\nNon-empty, stable id returned by the Drive API.\n",
            "example": "0AOpExampleDriveIdUk9PVA"
          }
        },
        "required": [
          "driveId",
          "driveType"
        ]
      },
      "SharedDrivesRootPathDto": {
        "description": "Virtual root representing the \"Shared drives\" collection.\n\nListing this path enumerates shared drives accessible to the authenticated user.\nEach shared drive is then exposed as a FolderPath scoped by a SharedDriveRef.\nThis is a connector-level abstraction, not a native Google Drive resource.\n",
        "properties": {
          "pathType": {
            "type": "string",
            "default": "",
            "description": "Shape discriminator for this path.\nMust be SHARED_DRIVES_ROOT for this DTO.\n",
            "enum": [
              "SHARED_DRIVES_ROOT"
            ],
            "example": "SHARED_DRIVES_ROOT"
          }
        },
        "required": [
          "pathType"
        ]
      },
      "WebApiGoogleDrive2PathDto": {
        "description": "Polymorphic description of a Google Drive location used by connector operations.\n\nThe pathType discriminator selects the concrete shape:\n- ROOT - connector entry listing available spaces\n- SHARED_DRIVES_ROOT - virtual root listing shared drives\n- FOLDER - real folder or drive root\n- FILE - real file under a folder\n",
        "discriminator": {
          "propertyName": "pathType",
          "mapping": {
            "ROOT": "#/components/schemas/RootPathDto",
            "SHARED_DRIVES_ROOT": "#/components/schemas/SharedDrivesRootPathDto",
            "FOLDER": "#/components/schemas/FolderPathDto",
            "FILE": "#/components/schemas/FilePathDto"
          }
        },
        "oneOf": [
          {
            "$ref": "#/components/schemas/RootPathDto"
          },
          {
            "$ref": "#/components/schemas/SharedDrivesRootPathDto"
          },
          {
            "$ref": "#/components/schemas/FolderPathDto"
          },
          {
            "$ref": "#/components/schemas/FilePathDto"
          }
        ],
        "properties": {
          "pathType": {
            "type": "string"
          }
        },
        "required": [
          "pathType"
        ]
      },
      "GoogleDrive2UploadRawStreamResponse": {
